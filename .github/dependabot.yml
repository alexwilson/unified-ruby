version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same wait as minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
