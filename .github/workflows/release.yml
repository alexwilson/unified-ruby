name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  test:
    # All development dependencies run here, in their own job. They cannot
    # change the files that the pack job builds.
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  pack:
    # Build and pack with read-only permissions. Only the build tools (tsc,
    # micromark-build) run before `pnpm pack`, not the test tools.
    needs: [release-please, test]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # `pnpm pack` replaces `workspace:^` with real versions.
      - id: pack
        name: pack released packages
        env:
          PATHS: ${{ needs.release-please.outputs.paths_released }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            (cd "$path" && pnpm pack --pack-destination "$RUNNER_TEMP/dist")
          done
          cd "$RUNNER_TEMP/dist"
          sha256sum -- *.tgz > SHA256SUMS
          cat SHA256SUMS
          {
            echo 'sums<<EOF'
            cat SHA256SUMS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
  publish:
    # No checkout and no install: only npm and the tarballs.
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      # The job output is the list of what to publish. `sha256sum --check`
      # ignores files that the list does not name, so publish only the named
      # files: an extra tarball in the artifact is never published.
      - name: check tarballs
        working-directory: dist
        env:
          SUMS: ${{ needs.pack.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/SHA256SUMS"
          sha256sum --check --strict "$RUNNER_TEMP/SHA256SUMS"
          sha256sum --check --strict SHA256SUMS
      - name: publish
        working-directory: dist
        run: |
          while read -r _ tarball; do
            npm publish "./${tarball#\*}" --access public --provenance
          done < "$RUNNER_TEMP/SHA256SUMS"
